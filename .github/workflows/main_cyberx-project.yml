name: Build and deploy Cyberspace-X to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VITE_SUPABASE_PROJECT_ID: ${{ vars.VITE_SUPABASE_PROJECT_ID }}
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_OPENROUTER_API_KEY: ${{ secrets.VITE_OPENROUTER_API_KEY }}
      VITE_OPENROUTER_MODEL: ${{ vars.VITE_OPENROUTER_MODEL }}
      VITE_OPENROUTER_FALLBACK_MODELS: ${{ vars.VITE_OPENROUTER_FALLBACK_MODELS }}
      VITE_OPENROUTER_SITE_URL: ${{ vars.VITE_OPENROUTER_SITE_URL }}
      VITE_OPENROUTER_SITE_TITLE: ${{ vars.VITE_OPENROUTER_SITE_TITLE }}
      VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
      VITE_LOCATIONIQ_API_KEY: ${{ secrets.VITE_LOCATIONIQ_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Validate required frontend configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Missing repo variable VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing repo secret VITE_SUPABASE_ANON_KEY"; exit 1; }

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix server

      - name: Build frontend
        run: npm run build

      - name: Prepare deployment package
        run: |
          rm -rf deploy
          mkdir -p deploy
          cp -R dist deploy/dist
          cp -R server deploy/server
          cp package.json deploy/package.json

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: cyberx-webapp-package
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: cyberx-webapp-package
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F9674CD18B64FAF92CC06B255BC901F }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_ECBC2BD11B1A4793BE2496CFD927C896 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_2EE598F8273E465C84DB8AE4105A4520 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: cyberx-project
          slot-name: Production
          package: .
          startup-command: node server/index.js
